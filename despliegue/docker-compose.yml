# Despliegue del prototipo en la PC de oficina (ADR-008): PostgreSQL 16, API y Caddy con HTTPS de autoridad interna.
# Uso: copia .env.example a .env, cambia las contraseñas y ejecuta  docker compose up -d --build
name: fefo
services:
  bd:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fefo
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Define PG_PASSWORD en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ../bd:/bd:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fefo"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: despliegue/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_fefo:${APP_DB_PASSWORD}@bd:5432/fefo
      DATABASE_ADMIN_URL: postgres://postgres:${PG_PASSWORD}@bd:5432/postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: America/Mexico_City
    depends_on:
      bd: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      FEFO_HOST: ${FEFO_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    depends_on: [api]

volumes:
  datos_pg:
  caddy_datos:
